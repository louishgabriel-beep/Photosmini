<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour Camille ❤️</title>
  <style>
    :root {
      --bg: #fffaf7;
      --card-bg: #ffffff;
      --accent: #e06d75;
      --text: #333333;
      --muted: #888888;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; overflow-x: hidden; }

    /* --- ÉCRAN DE CONNEXION --- */
    #login-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; transition: opacity 0.5s ease;
    }
    .login-box {
      background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: var(--shadow);
      width: 90%; max-width: 350px; text-align: center;
    }
    .login-box h2 { color: var(--accent); margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: var(--muted); }
    .input-group input {
      width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;
    }
    .btn {
      background: var(--accent); color: white; border: none; padding: 12px 20px;
      width: 100%; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    .error-msg { color: red; font-size: 0.8rem; margin-top: 10px; display: none; }

    /* --- LE SITE PRINCIPAL --- */
    #main-content { display: none; width: 100%; max-width: 420px; flex-direction: column; align-items: center; }
    
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 6px; }
    p.subtitle { font-size: 0.95rem; color: var(--muted); }
    
    .card {
      background: var(--card-bg); width: 100%; border-radius: 20px; box-shadow: var(--shadow);
      overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 16px; text-align: center;
    }
    .image-container { width: 100%; height: 380px; background: #f0f0f0; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .image-container img { width: 100%; height: 100%; object-fit: cover; }
    
    .caption { margin-top: 18px; font-size: 1.05rem; line-height: 1.4; color: var(--text); font-weight: 500; }
    .date-badge { margin-top: 12px; font-size: 0.8rem; color: var(--accent); background: rgba(224, 109, 117, 0.12); padding: 4px 10px; border-radius: 12px; font-weight: 600; }
    
    /* --- BOUTONS CUSTOM --- */
    .custom-buttons { display: flex; gap: 15px; margin-top: 25px; width: 100%; justify-content: center; }
    .cute-btn {
      background: white; border: 2px solid var(--accent); color: var(--accent); padding: 10px 15px;
      border-radius: 20px; font-weight: bold; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
    }
    .cute-btn span { display: inline-block; transition: transform 0.3s ease; }
    .cute-btn .hidden-text {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, 150%);
      width: 100%; text-align: center; color: white; transition: transform 0.3s ease;
    }
    .cute-btn.active { background: var(--accent); color: white; }
    .cute-btn.active span.default-text { transform: translateY(-150%); }
    .cute-btn.active .hidden-text { transform: translate(-50%, -50%); }

  </style>
</head>
<body>

  <!-- ÉCRAN DE CONNEXION -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Accès Réservé ❤️</h2>
      <div class="input-group">
        <label>Identifiant</label>
        <input type="text" id="userid" placeholder="Qui es-tu ?">
      </div>
      <div class="input-group">
        <label>Mot de passe</label>
        <input type="password" id="userpw" placeholder="Le mot magique">
      </div>
      <button class="btn" onclick="checkLogin()">Déverrouiller</button>
      <div id="error-msg" class="error-msg">Identifiant ou mot de passe incorrect.</div>
    </div>
  </div>

  <!-- CONTENU PRINCIPAL -->
  <div id="main-content">
    <header>
      <h1>Notre Année ❤️</h1>
      <p class="subtitle">Un nouveau souvenir chaque jour</p>
    </header>

    <div class="card">
      <div class="image-container" id="media-box"></div>
      <div class="caption" id="caption-text">Chargement...</div>
      <div class="date-badge" id="date-badge"></div>
    </div>

    <div class="custom-buttons">
      <button class="cute-btn" onclick="toggleCuteBtn(this)">
        <span class="default-text">Mbb 💕</span>
        <span class="hidden-text">Je t'aime !</span>
      </button>
      <button class="cute-btn" onclick="toggleCuteBtn(this)">
        <span class="default-text">Ma Camille ✨</span>
        <span class="hidden-text">Pour toujours</span>
      </button>
    </div>
  </div>

  <script>
    /* =========================================================
       👇 LOUIS : C'EST ICI QUE TU AJOUTES TES PHOTOS ! 👇
       
       1. Ajoute tes photos dans le dossier "photos" sur GitHub.
       2. Copie-colle un bloc entre les accolades { ... } ci-dessous 
          pour chaque nouvelle journée.
       3. Change la date, le nom du fichier et le texte.
       ========================================================= */

    const souvenirs = [
      {
        date: "2026-09-07",
        photo: "photos/souvenir1.jpg",
        texte: "Le premier jour de notre aventure ! ❤️"
      },
      {
        date: "2026-09-08",
        photo: "photos/souvenir2.jpg",
        texte: "Un nouveau jour, une nouvelle photo..."
      }
      // 👈 Ajoute les suivants ici au fur et à mesure !
    ];

    /* =========================================================
       👆 FIN DE TA ZONE DE MODIFICATION 👆
       Ne touche pas au code ci-dessous sauf si tu sais ce que tu fais 😉
       ========================================================= */

    // Gestion de la connexion
    function checkLogin() {
      const id = document.getElementById('userid').value.trim();
      const pw = document.getElementById('userpw').value.trim();
      
      // Vérification (Attention aux majuscules/minuscules)
      if (id.toLowerCase() === 'camille' && pw.toLowerCase() === 'spot') {
        document.getElementById('login-screen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('main-content').style.display = 'flex';
          initSite(); // Charge la photo seulement si connectée
        }, 500);
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    // Gestion de la photo du jour
    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function initSite() {
      const today = getTodayString();
      const mediaBox = document.getElementById('media-box');
      const captionText = document.getElementById('caption-text');
      const dateBadge = document.getElementById('date-badge');

      const todaySouvenir = souvenirs.find(s => s.date === today);

      if (todaySouvenir) {
        mediaBox.innerHTML = `<img src="${todaySouvenir.photo}" alt="Souvenir">`;
        captionText.textContent = todaySouvenir.texte;
        dateBadge.textContent = "Aujourd'hui ✨";
      } else {
        mediaBox.innerHTML = `<div style="padding:40px; color:#888; font-size:3rem;">🔒</div>`;
        captionText.textContent = "Reviens demain pour la prochaine surprise !";
        dateBadge.textContent = "Patience...";
      }
    }

    // Gestion des boutons animés
    function toggleCuteBtn(btn) {
      btn.classList.toggle('active');
      setTimeout(() => {
        if(btn.classList.contains('active')) {
          btn.classList.remove('active');
        }
      }, 2500); // Le bouton se remet à zéro après 2.5 secondes
    }
  </script>
</body>
</html>
