<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notre Année de Souvenirs ❤️</title>
  <style>
    :root {
      --bg: #fffaf7;
      --card-bg: #ffffff;
      --accent: #e06d75;
      --text: #333333;
      --muted: #888888;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 0.95rem;
      color: var(--muted);
    }
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      text-align: center;
    }
    .image-container {
      width: 100%;
      height: 380px;
      background: #f0f0f0;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .locked-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      padding: 20px;
    }
    .locked-box .lock-icon {
      font-size: 3rem;
    }
    .caption {
      margin-top: 18px;
      font-size: 1.05rem;
      line-height: 1.4;
      color: var(--text);
      font-weight: 500;
      padding: 0 8px;
    }
    .date-badge {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(224, 109, 117, 0.12);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }
    .countdown {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 16px;
    }
    .history-title {
      max-width: 420px;
      width: 100%;
      margin: 32px 0 12px;
      font-size: 1.1rem;
      color: #555;
      text-align: left;
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 40px;
    }
    .history-item {
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: #eee;
      cursor: pointer;
    }
    .history-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <header>
    <h1>Notre Histoire ❤️</h1>
    <p class="subtitle">Un nouveau souvenir chaque jour</p>
  </header>

  <div class="card" id="main-card">
    <div class="image-container" id="media-box">
      <!-- Image ou Cadenas -->
    </div>
    <div class="caption" id="caption-text">Chargement...</div>
    <div class="date-badge" id="date-badge"></div>
  </div>

  <div class="countdown" id="countdown-text"></div>

  <div class="history-title">Les jours précédents</div>
  <div class="history-grid" id="history-grid"></div>

  <script>
    // Format des dates : AAAA-MM-JJ
    // Tu ajouteras tes photos et anecdotes au fur et à mesure ici !
    const souvenirs = [
      {
        date: "2026-09-07",
        photo: "photos/souvenir1.jpg",
        texte: "Le premier jour de notre aventure ! ❤️"
      },
      {
        date: "2026-09-08",
        photo: "photos/souvenir2.jpg",
        texte: "Ce fou rire qu'on a eu..."
      },
      {
        date: "2026-09-09",
        photo: "photos/souvenir3.jpg",
        texte: "Un petit mot rien que pour toi."
      }
    ];

    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function initSite() {
      const today = getTodayString();
      const mediaBox = document.getElementById('media-box');
      const captionText = document.getElementById('caption-text');
      const dateBadge = document.getElementById('date-badge');
      const historyGrid = document.getElementById('history-grid');

      // Chercher le souvenir du jour
      const todaySouvenir = souvenirs.find(s => s.date === today);

      // Récupérer les souvenirs passés
      const pastSouvenirs = souvenirs.filter(s => s.date < today);

      if (todaySouvenir) {
        mediaBox.innerHTML = `<img src="${todaySouvenir.photo}" alt="Souvenir du jour" onerror="this.src='https://via.placeholder.com/400x400?text=Photo+non+trouvee'">`;
        captionText.textContent = todaySouvenir.texte;
        dateBadge.textContent = "Aujourd'hui ✨";
      } else {
        mediaBox.innerHTML = `
          <div class="locked-box">
            <div class="lock-icon">🔒</div>
            <div>Reviens demain pour la prochaine surprise !</div>
          </div>
        `;
        captionText.textContent = "Le souvenir du jour n'est pas encore disponible";
        dateBadge.textContent = "Patience...";
      }

      // Remplir l'historique
      historyGrid.innerHTML = "";
      pastSouvenirs.reverse().forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<img src="${item.photo}" alt="Souvenir passé" onclick="alert('${item.texte.replace(/'/g, "\\'")}')">`;
        historyGrid.appendChild(div);
      });
    }

    initSite();
  </script>
</body>
</html>
